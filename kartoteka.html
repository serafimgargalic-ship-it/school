<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Картотека</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ecef;--panel:#f7f9fa;--ink:#17262f;--mute:#5d6e78;--line:#c3cdd3;--acc:#1f5c8b;--accink:#fff;--danger:#a63a2b;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181d;--panel:#18232a;--ink:#e6edf1;--mute:#93a4ae;--line:#2d3d46;--acc:#6fb1e0;--accink:#0c1a24;--danger:#e58b7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10181d;--panel:#18232a;--ink:#e6edf1;--mute:#93a4ae;--line:#2d3d46;--acc:#6fb1e0;--accink:#0c1a24;--danger:#e58b7c;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:clamp(30px,6vw,44px);line-height:1.05;margin:0 0 4px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 24px;max-width:60ch}
form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;grid-template-columns:1fr 1fr}
label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
label.wide{grid-column:1/-1}
input[type=text],input[type=search]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
input[type=file]{font:inherit;color:var(--mute);font-size:14px;max-width:100%}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.actions{grid-column:1/-1;display:flex;justify-content:flex-end}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 12px}
button.main{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:500;padding:10px 18px}
button.del{color:var(--danger);border-color:transparent;padding:4px 8px;font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 10px}
.bar h2{margin:0;font-size:20px}
.bar input{max-width:240px}
.list{display:grid;gap:10px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px 16px;align-items:start}
.name{font-weight:700;font-size:18px;overflow-wrap:anywhere}
.link a{color:var(--acc);overflow-wrap:anywhere}
.none{color:var(--mute);font-size:14px}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;max-width:100%}
.chip button{border:0;padding:0 6px;color:var(--mute);font-size:15px;line-height:1}
.chip .open{border:0;padding:0;color:var(--acc);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline}
.thumb{height:44px;width:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer}
.addf{font-size:13px;padding:3px 10px;margin-top:6px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--mute)}
.note{margin-top:20px;font-size:13px;color:var(--mute)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:6px}
@media (max-width:620px){form{grid-template-columns:1fr}.row{grid-template-columns:1fr}.bar{flex-wrap:wrap}.bar input{max-width:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Картотека</h1>
<p class="sub">Добавьте человека, прикрепите ссылку или файлы — всё останется в списке даже после закрытия страницы.</p>

<form id="f" autocomplete="off">
  <label>Имя<input type="text" id="first" required></label>
  <label>Фамилия<input type="text" id="last" required></label>
  <label class="wide">Ссылка (необязательно)<input type="text" id="url" placeholder="https://"></label>
  <label class="wide">Файлы (необязательно)<input type="file" id="files" multiple></label>
  <div class="actions"><button class="main" type="submit">Добавить человека</button></div>
</form>

<div class="bar">
  <h2 id="count">Люди</h2>
  <input type="search" id="q" placeholder="Поиск по имени" aria-label="Поиск по имени">
</div>
<div class="list" id="list"></div>
<p class="note" id="note">Данные хранятся в браузере на этом устройстве. На другом устройстве или в другом браузере список будет пустым.</p>
</main>
<div id="lb" role="dialog" aria-label="Просмотр изображения"><img alt=""></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var people=[], db=null, urls=[];
  var DB='kartoteka', ST='people';

  function openDb(){
    return new Promise(function(res,rej){
      try{
        var r=indexedDB.open(DB,1);
        r.onupgradeneeded=function(){r.result.createObjectStore(ST,{keyPath:'id'})};
        r.onsuccess=function(){res(r.result)};
        r.onerror=function(){rej(r.error)};
      }catch(e){rej(e)}
    });
  }
  function store(mode){return db.transaction(ST,mode).objectStore(ST)}
  function wait(req){return new Promise(function(res,rej){req.onsuccess=function(){res(req.result)};req.onerror=function(){rej(req.error)}})}
  function save(p){if(!db)return Promise.resolve();return wait(store('readwrite').put(p)).catch(warn)}
  function remove(id){if(!db)return Promise.resolve();return wait(store('readwrite').delete(id)).catch(warn)}
  function warn(){$('note').textContent='Не удалось сохранить в браузере: данные пропадут после закрытия страницы.'}

  function fixUrl(v){
    v=(v||'').trim(); if(!v) return '';
    if(!/^https?:\/\//i.test(v)) v='https://'+v;
    try{var u=new URL(v); return (u.protocol==='http:'||u.protocol==='https:')?u.href:''}catch(e){return ''}
  }
  function readFiles(list){
    return Array.prototype.map.call(list||[],function(f){return {id:String(Date.now())+Math.random().toString(36).slice(2,7),name:f.name,type:f.type,size:f.size,blob:f}});
  }
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

  function openFile(f){
    var u=URL.createObjectURL(f.blob); urls.push(u);
    var a=document.createElement('a'); a.href=u; a.download=f.name; a.target='_blank'; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
  }
  function showImg(f){
    var u=URL.createObjectURL(f.blob); urls.push(u);
    var lb=$('lb'); lb.querySelector('img').src=u; lb.classList.add('on');
  }
  $('lb').addEventListener('click',function(){this.classList.remove('on')});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')$('lb').classList.remove('on')});

  function render(){
    urls.forEach(function(u){URL.revokeObjectURL(u)}); urls=[];
    var q=$('q').value.trim().toLowerCase();
    var shown=people.filter(function(p){return (p.first+' '+p.last).toLowerCase().indexOf(q)>-1});
    $('count').textContent=people.length?('Люди: '+people.length):'Люди';
    var list=$('list'); list.textContent='';
    if(!shown.length){
      list.appendChild(el('div','empty',people.length?'Никого не нашли. Измените запрос.':'Пока никого нет. Заполните форму выше и нажмите «Добавить человека».'));
      return;
    }
    shown.forEach(function(p){
      var row=el('div','row');
      row.appendChild(el('div','name',p.first+' '+p.last));

      var mid=el('div','link');
      if(p.url){var a=el('a',null,p.url.replace(/^https?:\/\//,'').replace(/\/$/,''));a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';mid.appendChild(a)}
      else mid.appendChild(el('span','none','Ссылки нет'));
      var fw=el('div','files');
      p.files.forEach(function(f){
        if(/^image\//.test(f.type)){
          var im=el('img','thumb'); var u=URL.createObjectURL(f.blob); urls.push(u); im.src=u; im.alt=f.name; im.title=f.name;
          im.addEventListener('click',function(){showImg(f)}); fw.appendChild(im);
        }
        var chip=el('span','chip');
        var ob=el('button','open',f.name); ob.type='button'; ob.addEventListener('click',function(){openFile(f)});
        var x=el('button',null,'×'); x.type='button'; x.setAttribute('aria-label','Убрать файл '+f.name);
        x.addEventListener('click',function(){p.files=p.files.filter(function(g){return g.id!==f.id});save(p).then(render)});
        chip.appendChild(ob); chip.appendChild(x); fw.appendChild(chip);
      });
      var inp=document.createElement('input'); inp.type='file'; inp.multiple=true; inp.hidden=true;
      inp.addEventListener('change',function(){p.files=p.files.concat(readFiles(inp.files));save(p).then(render)});
      var ad=el('button','addf','Добавить файл'); ad.type='button'; ad.addEventListener('click',function(){inp.click()});
      mid.appendChild(fw); mid.appendChild(ad); mid.appendChild(inp);
      row.appendChild(mid);

      var d=el('button','del','Удалить'); d.type='button';
      d.addEventListener('click',function(){
        if(!confirm('Удалить «'+p.first+' '+p.last+'»?'))return;
        people=people.filter(function(x){return x.id!==p.id}); remove(p.id).then(render);
      });
      row.appendChild(d);
      list.appendChild(row);
    });
  }

  $('f').addEventListener('submit',function(e){
    e.preventDefault();
    var first=$('first').value.trim(), last=$('last').value.trim();
    if(!first||!last)return;
    var p={id:String(Date.now())+Math.random().toString(36).slice(2,6),first:first,last:last,url:fixUrl($('url').value),files:readFiles($('files').files),created:Date.now()};
    people.unshift(p);
    save(p).then(function(){$('f').reset();$('q').value='';render();$('first').focus()});
  });
  $('q').addEventListener('input',render);

  openDb().then(function(d){
    db=d;
    return wait(store('readonly').getAll());
  }).then(function(all){
    people=(all||[]).sort(function(a,b){return b.created-a.created});
  }).catch(function(){
    warn();
  }).then(render);
})();
</script>
</body>
</html>
